<!DOCTYPE html>
<html>
<head>
    <title>BingX P2P Monitor</title>
    <style>
        body { width: 300px; padding: 10px; font-family: Arial, sans-serif; }
        .container { display: flex; flex-direction: column; gap: 10px; }
        input, button { padding: 8px; margin: 5px 0; font-size: 14px; }
        button { background-color: #4CAF50; color: white; border: none; cursor: pointer; }
        button:hover { background-color: #45a049; }
        input { border: 1px solid #ccc; border-radius: 4px; }
        #status { color: #333; font-size: 14px; }
        #error { color: red; font-size: 14px; }
    </style>
</head>
<body>
<div class="container">
    <h2>BingX P2P Monitor</h2>
    <button id="checkSelectors">Проверить селекторы</button>
    <label for="userPrice">Ваша цена (THB):</label>
    <input type="number" id="userPrice" step="0.001" placeholder="Введите вашу цену">
    <button id="startMonitoring">Начать мониторинг</button>
    <button id="stopMonitoring" disabled>Остановить мониторинг</button>
    <div id="status"></div>
    <div id="error"></div>
</div>
<script src="popup.js"></script>
</body>
</html>
